name: Release automatisch anlegen

# Sobald die Version in manifest.json erhöht wird, legt GitHub selbst ein
# Release an (z. B. v1.1.5). HACS zeigt dann diese Versionsnummer an.
# Erst NACHDEM „Prüfen“ (HACS, hassfest, Tests) grün durchgelaufen ist –
# so will es HACS für die Aufnahme in die offizielle Liste.
on:
  workflow_run:
    workflows: ["Prüfen"]
    types: [completed]
    branches: [main, beta]   # 🧪 „beta“ = Testversionen (Vorabversion, nur für HACS „Beta-Versionen anzeigen“)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.SHA }}

      - name: Version auslesen
        id: version
        run: echo "tag=v$(jq -r .version custom_components/kegelclub/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: 📥 Download-Zahl für die Credits in die ZIP legen
        # Summe aller ZIP-Downloads aller Releases (GitHub-API, nur hier beim Release – die Karte fragt GitHub nie).
        # Überschreibt www/downloads.json (im Repo steht nur ein Platzhalter mit 0, damit es kein 404 gibt) –
        # klappt die Abfrage nicht, bleibt die 0 und die Credits zeigen keine Zahl. Das Release läuft trotzdem weiter.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate -q '.[].assets[] | select(.name | endswith(".zip")) | .download_count' 2>/dev/null | awk '{s+=$1} END {print s+0}') || N=0
          if [ "${N:-0}" -gt 0 ]; then
            printf '{"downloads": %s, "stand": "%s"}\n' "$N" "$(date -u +%F)" > custom_components/kegelclub/www/downloads.json
            cat custom_components/kegelclub/www/downloads.json
          else
            echo "Keine Download-Zahl bekommen – Credits zeigen dann keine Zahl."
          fi

      - name: 📦 ZIP für HACS packen (zählt die Downloads)
        # HACS lädt dann diese fertige ZIP statt des Quellcodes – nur so zählt GitHub die Downloads.
        # Drin ist genau der Inhalt von custom_components/kegelclub/ (ohne Unterordner davor),
        # so wie HACS es bei „zip_release“ erwartet. Es geht dabei nichts von den Nutzern ins Internet.
        run: |
          cd custom_components/kegelclub
          zip -r -q -X "$GITHUB_WORKSPACE/kegelclub.zip" . -x '*__pycache__*' '*.pyc'
          cd "$GITHUB_WORKSPACE" && unzip -l kegelclub.zip | tail -1
          unzip -l kegelclub.zip | awk '{print $4}' | grep -qx 'manifest.json' || { echo "manifest.json fehlt oben in der ZIP"; exit 1; }

      - name: Release anlegen (nur wenn es die Version noch nicht gibt)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          # 🧪 Sicherung: Auf „beta“ nur Versionen mit -beta, auf „main“ nie eine -beta
          PRE=""
          case "$TAG" in *-beta*) PRE="--prerelease";; esac
          if [ "$BRANCH" = "beta" ] && [ -z "$PRE" ]; then echo "Auf beta nur -beta-Versionen – nichts zu tun."; exit 0; fi
          if [ "$BRANCH" != "beta" ] && [ -n "$PRE" ]; then echo "-beta gehört auf den Zweig beta – nichts zu tun."; exit 0; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 📦 Release gibt es schon – nur die ZIP nachreichen, falls sie fehlt
            if gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx kegelclub.zip; then
              # 📥 Von Hand gestartet und in der alten ZIP steht noch keine Download-Zahl? Dann die ZIP einmal ersetzen
              # (betrifft nur ganz frische Betas, die noch mit dem alten Bauplan gepackt wurden).
              if [ "${{ github.event_name }}" = "workflow_dispatch" ] && grep -q "\"downloads\": [1-9]" custom_components/kegelclub/www/downloads.json \
                 && gh release download "$TAG" -p kegelclub.zip -O old.zip && ! { unzip -p old.zip downloads.json 2>/dev/null | grep -q '"downloads": [1-9]'; }; then
                gh release upload "$TAG" kegelclub.zip --clobber
                echo "ZIP von $TAG mit Download-Zahl ersetzt."
              else
                echo "Release $TAG gibt es schon (mit ZIP) – nichts zu tun."
              fi
            else
              gh release upload "$TAG" kegelclub.zip
            fi
          else
            # 📝 Kurze deutsche Beschreibung: die Commit-Texte seit dem letzten Release
            PREV=$(git describe --tags --abbrev=0 --exclude '*-beta*' "$SHA^" 2>/dev/null || true)
            RANGE=${PREV:+$PREV..}$SHA
            {
              echo "## Was ist neu"
              git log "$RANGE" --no-merges --pretty=format:'- %s'
              echo
              [ -n "$PREV" ] && echo "**Alle Änderungen:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            } > notes.md
            if ! grep -q "^- " notes.md; then
              gh release create "$TAG" kegelclub.zip --target "$SHA" --title "$TAG" $PRE --generate-notes
            else
              gh release create "$TAG" kegelclub.zip --target "$SHA" --title "$TAG" $PRE --notes-file notes.md
            fi
          fi
