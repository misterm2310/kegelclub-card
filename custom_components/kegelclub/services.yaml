strafe_buchen:
  fields:
    mitglied:
      required: true
      example: "Anna"
      selector:
        text:
    strafe:
      required: true
      example: "Pumpe"
      selector:
        text:
    anzahl:
      default: 1
      selector:
        number:
          min: -50
          max: 50
          step: 1
          mode: box
    abend:
      example: "2026-10-31"
      selector:
        text:
    club:
      example: "Kegelclub"
      selector:
        text:
abend_starten:
  fields:
    datum:
      selector:
        date:
    stunden:
      example: 3
      selector:
        number:
          min: 0
          max: 24
          step: 0.5
          mode: box
    club:
      example: "Kegelclub"
      selector:
        text:
abend_abschliessen:
  fields:
    abend:
      example: "2026-10-31"
      selector:
        text:
    club:
      example: "Kegelclub"
      selector:
        text:
einzahlung:
  fields:
    mitglied:
      required: true
      example: "Anna"
      selector:
        text:
    betrag:
      required: true
      example: 7.5
      selector:
        number:
          min: -10000
          max: 10000
          step: 0.01
          mode: box
    club:
      example: "Kegelclub"
      selector:
        text:
ausgabe:
  fields:
